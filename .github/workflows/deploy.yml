name: Deploy site and app

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test desktop/tests/AceHeadsetFix.Tests --filter "Category!=Network"
      - name: Publish
        run: desktop/publish.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: AceHeadsetFix
          path: desktop/publish/AceHeadsetFix.exe
          if-no-files-found: error

  deploy-site:
    needs: build-app
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AceHeadsetFix
          path: docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
